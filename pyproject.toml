[project]
name = "flavormap"
version = "0.1.0"
description = "Computational geography of Thai cuisine — ingredient network analysis across 77 provinces."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "playwright>=1.45",
    "anthropic>=0.34",
    "pandas>=2.2",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "scipy>=1.13",
    "geopandas>=1.0",
    "libpysal>=4.11",
    "esda>=2.5",
    "folium>=0.17",
    "matplotlib>=3.9",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
