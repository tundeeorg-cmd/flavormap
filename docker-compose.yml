services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: flavormap
      POSTGRES_USER: flavormap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flavormap -d flavormap"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
